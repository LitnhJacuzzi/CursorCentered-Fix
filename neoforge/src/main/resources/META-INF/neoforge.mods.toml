modLoader="javafml"
loaderVersion="[2,)"
issueTrackerURL="${issues_url}"
license="${license}"

[[mods]] 
modId="${mod_id}" 
version="${mod_version}"
displayName="${mod_name}"
logoFile="${mod_logo}"
