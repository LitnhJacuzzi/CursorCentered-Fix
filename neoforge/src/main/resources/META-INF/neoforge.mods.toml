[[dependencies.${mod_id}]] 
    modId="neoforge" 
    type="required" 
    versionRange="[20.5,)" 
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="[1.20.5,)"
    ordering="NONE"
    side="CLIENT"