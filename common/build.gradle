plugins {
	id 'eclipse'
	id 'java'
}

dependencies {
	compileOnly 'net.java.dev.jna:jna:5.15.0'
	compileOnly 'net.java.dev.jna:jna-platform:5.15.0'
	compileOnly 'org.apache.logging.log4j:log4j-api:2.25.2'
	compileOnly 'org.apache.logging.log4j:log4j-core:2.25.2'
	compileOnly 'org.apache.logging.log4j:log4j-slf4j2-impl:2.25.2'
	compileOnly 'org.lwjgl:lwjgl-glfw:3.3.3'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}


