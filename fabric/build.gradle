plugins {
	id 'fabric-loom' version "1.8+"
}

base {
	archivesName = "${mod_id}-${mod_version}-fabric+1.14.4-1.21.11"
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	
	implementation project(':common')
}

loom {
	mixin {
		useLegacyMixinAp = false
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 8
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
	
	from sourceSets.main.output
	from project(":common").sourceSets.main.output
}

tasks.register('buildUnremapped', Jar) {
	group = 'build'
	archiveBaseName = "${mod_id}-${mod_version}-fabric-26.1+"
	from sourceSets.main.output
	from project(":common").sourceSets.main.output
	System.setProperty("fabric.loom.dontRemap", "true")
}

artifacts {
    archives buildUnremapped
}